version: '3.8'

services:
  mysql:
    build: ./database
    container_name: devops_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: devops_db
      MYSQL_USER: devops_user
      MYSQL_PASSWORD: devops_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - devops_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build: ./backend
    container_name: devops_backend
    environment:
      DB_HOST: mysql
      DB_USER: devops_user
      DB_PASSWORD: devops_password
      DB_NAME: devops_db
      DB_PORT: 3306
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - devops_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: devops_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - devops_network

volumes:
  mysql_data:

networks:
  devops_network:
    driver: bridge